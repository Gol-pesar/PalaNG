name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if [ -z "${JAVA_HOME:-}" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
            echo "ERROR: JAVA_HOME is not configured properly." >&2
            exit 1
          fi

          java -version

          JAVA_VERSION_LINE="$(java -version 2>&1 | head -n 1)"
          RAW_VERSION="$(echo "$JAVA_VERSION_LINE" | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "$RAW_VERSION" ]; then
            echo "ERROR: Could not detect active Java version from: $JAVA_VERSION_LINE" >&2
            exit 1
          fi

          if [[ "$RAW_VERSION" == 1.* ]]; then
            MAJOR_VERSION="$(echo "$RAW_VERSION" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(echo "$RAW_VERSION" | cut -d'.' -f1 | sed -E 's/[^0-9].*//')"
          fi

          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to parse Java major version from: $RAW_VERSION" >&2
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected Java $MAJOR_VERSION." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ ! -f "./debug.keystore" ]; then
            if [ ! -x "$JAVA_HOME/bin/keytool" ]; then
              echo "ERROR: keytool not found in $JAVA_HOME/bin" >&2
              exit 1
            fi
            "$JAVA_HOME/bin/keytool" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Temporary ./debug.keystore does not exist after generation." >&2
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$APK_PATH" ]; then
            echo "ERROR: Expected debug APK not found at $APK_PATH" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:" >&2
              find app/build/outputs/apk -type f -name '*.apk' >&2 || true
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is not a regular file." >&2
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is empty." >&2
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: $APK_PATH does not have a .apk extension." >&2
              exit 1
              ;;
          esac

          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SRC_APK" ] || [ ! -s "$SRC_APK" ]; then
            echo "ERROR: Verified debug APK missing at $SRC_APK" >&2
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_DIR="${RUNNER_TEMP}/release-asset-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$TEMP_DIR"

          ASSET_PATH="${TEMP_DIR}/${ASSET_FILENAME}"
          cp "$SRC_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $ASSET_PATH" >&2
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI (gh) is not available." >&2
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty." >&2
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Prepared release asset does not have a .apk extension." >&2
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="${RUNNER_TEMP}/release-notes-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.md"
          cat > "$NOTES_FILE" <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** \`${GITHUB_SHA}\`

          > **Note:** This APK is intended for testing only. It is **not** a Play Store production release and is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always() && steps.prepare_asset.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_TITLE="$(gh release view "$RELEASE_TAG" --json name --jq '.name')"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            ASSET_LIST="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | tr '\n' ' ')"

            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "GitHub Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_FILENAME}"
            echo "Confirmed Release Assets: ${ASSET_LIST}"

            {
              echo "### Debug APK Build & GitHub Release Published"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **APK Asset:** \`${ASSET_FILENAME}\` (download directly from the **Assets** section on the release page)"
              echo "- **Backup Artifact:** GitHub Actions artifact \`app-debug-apk\` is also available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed for tag ${RELEASE_TAG}. The debug APK build and Actions artifact upload succeeded."
            echo "APK build succeeded. Actions artifact 'app-debug-apk' remains available for download."

            {
              echo "### Warning: GitHub Release Publishing Failed"
              echo ""
              echo "- **Build Status:** Debug APK build succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)."
              echo "- **Backup Artifact:** The GitHub Actions artifact named \`app-debug-apk\` was uploaded successfully and remains available for download."
              echo "- **Release Status:** Publishing to GitHub Releases failed; check the \`Publish APK to GitHub Releases\` step logs for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
